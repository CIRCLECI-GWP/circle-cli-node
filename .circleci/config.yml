version: 2.1
orbs:
  snyk: snyk/snyk@2.3.0
jobs:
  run_tests:
    docker:
      - image: cimg/node:26.13
    steps:
      - checkout
      - run:
          name: Install npm dependencies
          command: |
            npm ci
      - run:
          name: Run Unit Tests
          command: |
            npx mocha test/ --reporter mochawesome --reporter-options reportDir=test-results,reportFilename=test-results
  vulnerability_scan:
    docker:
      - image: cimg/node:26.13
    steps:
      - checkout
      - run:
          name: Install npm dependencies
          command: |
            npm ci
      - snyk/scan:
          fail-on-issues: false
workflows:
  build_test:
    jobs:
      - run_tests
      - vulnerability_scan
